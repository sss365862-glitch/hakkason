<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>思考災害</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 上部：タイトル・注意書き・進行表示 -->
  <header class="top">
    <div class="title-row">
      <h1>思考災害</h1>
      <p class="notice">観測のみ。刺激を与えないでください。</p>
    </div>
    <div class="status">
      <span id="formLabel"></span>
      <span id="aiLabel"></span>
    </div>
  </header>

  <!-- 中央：暗い脳内の観測室 -->
  <main id="stage" class="stage">
    <div class="stars"></div>
    <div class="mist"></div>
    <svg id="circle" class="magic-circle" viewBox="-100 -100 200 200" aria-hidden="true">
      <circle r="96" fill="none" stroke-width="1.5"/>
      <circle r="84" fill="none" stroke-width="0.8" stroke-dasharray="3 5"/>
      <circle r="60" fill="none" stroke-width="1.2"/>
      <polygon points="0,-84 73,42 -73,42" fill="none" stroke-width="1"/>
      <polygon points="0,84 73,-42 -73,-42" fill="none" stroke-width="1"/>
      <circle r="30" fill="none" stroke-width="0.8" stroke-dasharray="1 3"/>
    </svg>
    <div id="cracks" class="cracks"></div>
    <div id="monsterBox" class="monster-box">
      <div id="monster" class="monster"></div>
    </div>
    <p id="monsterName" class="monster-name"></p>
    <div id="fx" class="fx"></div>
    <div id="whiteout" class="whiteout"></div>
    <p id="toast" class="toast"></p>
    <!-- 最終形態で投げる「不安の塊」 -->
    <button id="orb" class="orb hidden" aria-label="不安の塊を投げる"></button>
    <p id="endText" class="end-text">観測対象、消失</p>
  </main>

  <!-- 下部：入力と操作 -->
  <footer class="bottom">
    <div id="startPanel" class="panel">
      <p id="message" class="message"></p>
      <div class="row">
        <input id="thoughtInput" type="text" maxlength="20" value="遅刻した" autocomplete="off" aria-label="小さな不安を一言">
        <button id="observeBtn" class="primary">観測する</button>
      </div>
      <div class="row examples">
        <span class="hint">例文：</span>
        <button class="example" data-text="遅刻した">遅刻した</button>
        <button class="example" data-text="話を遮られた">話を遮られた</button>
        <button class="example" data-text="既読がつかない">既読がつかない</button>
      </div>
      <p class="hint">個人情報は入力しないでください</p>
    </div>

    <div id="nextPanel" class="panel hidden">
      <button id="nextBtn" class="primary">次の思考</button>
      <p class="hint">Enterでも進む</p>
    </div>

    <div id="throwPanel" class="panel hidden">
      <p class="throw-hint">不安の塊をクリック（Enter）で投げる</p>
    </div>

    <div id="againPanel" class="panel hidden">
      <button id="againBtn" class="primary">もう一度観測する</button>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
